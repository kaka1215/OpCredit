[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opcredit"
version = "0.1.0"
description = "Operation-aware policy learning for agentic KGQA"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
requires-python = ">=3.10"
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
train = ["transformers==5.5.4", "accelerate>=1.6,<2", "sentence-transformers>=4.1,<6"]
rl = ["vllm==0.21.0", "transformers==5.5.4", "sentence-transformers>=4.1,<6"]
distributed = ["deepspeed==0.16.7"]

[project.urls]
Repository = "https://github.com/kaka1215/OpCredit"
Issues = "https://github.com/kaka1215/OpCredit/issues"

[project.scripts]
opcredit-prepare = "opcredit.data.prepare:main"
opcredit-sft = "opcredit.training.sft:main"
opcredit-rl = "opcredit.training.rl:main"

[tool.setuptools.packages.find]
where = ["src"]
